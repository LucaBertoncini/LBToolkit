; Configurazione di base dell'esempio. Si passa come argomento: AIDemo ../config/AIDemo.ini
; I percorsi relativi di LogFile sono relativi all'ESEGUIBILE; RoutesFile e' relativo a QUESTA cartella.

[LBLogger]
; Registro accanto all'eseguibile: bin/logs/aidemo.log. Livello 5 = anche i messaggi di debug.
LogFile=logs/aidemo.log
LogLevel=5
MaxFileSize=5242880

[LBmicroWebServer]
Port=8081

[TokenManager]
; Inattivita' massima delle sessioni WEB (cookie), in secondi. I token dell'agente AI hanno la scadenza decisa
; dal server OAuth (AccessTokenLifetimeSec / RefreshTokenLifetimeSec in [OAuth]).
TokenExpirationTime=3600
; I token sono in memoria: un riavvio li perde e l'agente deve rifare il login.
; Per salvarli su SQLite vedi AIDemo_persist.ini (DBFile).

[AIDemo]
RoutesFile=Routes.xml

; ---- Server di autorizzazione OAuth: /.well-known/*, /oauth/register, /oauth/authorize, /oauth/token ----
; Senza "Enabled=1" non esiste (e non scrive nulla nel registro).
[OAuth]
Enabled=1
; L'indirizzo con cui l'agente raggiunge il server: SOLO schema, host e porta (niente /mcp, niente "/" finale).
PublicBaseURL=http://127.0.0.1:8081
; La password dell'utente viaggia nel modulo di accesso: in produzione serve https. Qui e' una prova locale.
AllowInsecureHTTP=1
; Ammette http://localhost e http://127.0.0.1 come indirizzo di ritorno (lo usa il client di prova e Claude Code).
AllowLoopbackRedirects=1
; Diciture della pagina di accesso (facoltative). {host} e {app} sono sostituiti dal server.
ServerTitle=AIDemo
LoginIntro=Accedi per consentire a {host} di usare {app} con i tuoi permessi.

; ---- Connettore MCP: /mcp. Richiede [OAuth] attivo e l'endpoint Kind="AIConnector" in Routes.xml ----
[AIConnector]
Enabled=1
ServerName=AIDemo
Instructions=Applicazione di prova. Usa demo_Ping per sapere con quali permessi lavori.
MaxCallsPerMinute=60
