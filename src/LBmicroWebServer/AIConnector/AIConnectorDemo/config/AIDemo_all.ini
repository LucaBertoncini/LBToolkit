; Variante: tutte le opzioni del connettore. Stessa applicazione, comportamento diverso.
;   ExposeUndescribed=1      anche demo_NonDescritta e' uno strumento (parametri liberi)
;   RequireOpTypeForTools=1  demo_Stato (senza OpType) NON e' piu' uno strumento
;   MaxCallsPerMinute=5      la sesta chiamata del minuto riceve "Too many requests"
;   AllowedOrigins           Origin accettate per richieste che arrivano da un browser

[LBLogger]
LogFile=logs/aidemo.log
LogLevel=5
MaxFileSize=5242880

[LBmicroWebServer]
Port=8081

[TokenManager]
TokenExpirationTime=3600

[AIDemo]
RoutesFile=Routes.xml

[OAuth]
Enabled=1
PublicBaseURL=http://127.0.0.1:8081
AllowInsecureHTTP=1
AllowLoopbackRedirects=1
ServerTitle=AIDemo (tutte le opzioni)

[AIConnector]
Enabled=1
ServerName=AIDemo
ExposeUndescribed=1
RequireOpTypeForTools=1
MaxCallsPerMinute=5
MaxResultKB=200
AllowedOrigins=http://127.0.0.1:8081
