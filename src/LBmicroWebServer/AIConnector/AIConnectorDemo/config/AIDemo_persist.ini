; Variante: token salvati su SQLite. Sopravvivono a un riavvio del server.
; Il file e' relativo alla cartella da cui parte il processo. Serve libsqlite3.so.

[LBLogger]
LogFile=logs/aidemo.log
LogLevel=5
MaxFileSize=5242880

[LBmicroWebServer]
Port=8081

[TokenManager]
TokenExpirationTime=3600
DBFile=data/aidemo_tokens.db

[AIDemo]
RoutesFile=Routes.xml

[OAuth]
Enabled=1
PublicBaseURL=http://127.0.0.1:8081
AllowInsecureHTTP=1
AllowLoopbackRedirects=1
ServerTitle=AIDemo (token su SQLite)

[AIConnector]
Enabled=1
ServerName=AIDemo
MaxCallsPerMinute=60
