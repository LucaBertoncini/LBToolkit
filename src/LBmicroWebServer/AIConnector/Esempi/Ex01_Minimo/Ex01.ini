; Esempio 1 - sezioni lette dal programma.
; Prova: python3 ../client/smoke_test.py ex01 http://127.0.0.1:8081

[LBmicroWebServer]
Port=8081

; Server di autorizzazione OAuth. Senza "Enabled=1" non esiste (nemmeno /oauth e /.well-known).
[OAuth]
Enabled=1
; L'indirizzo con cui l'agente raggiunge il server: SOLO schema, host e porta (niente /mcp, niente "/" finale).
PublicBaseURL=http://127.0.0.1:8081
; Vero in produzione deve essere https. Qui e' una prova locale.
AllowInsecureHTTP=1
; Ammette http://localhost e http://127.0.0.1 come indirizzo di ritorno (usato da Claude Code e dal client di prova).
AllowLoopbackRedirects=1
; Diciture della pagina di accesso (facoltative). {host} e {app} sono sostituiti dal server.
ServerTitle=Esempio 1
LoginIntro=Accedi per consentire a {host} di usare {app} con i tuoi permessi.

; Connettore MCP. Richiede [OAuth] attivo e, in Routes_Ex01.xml, l'endpoint Kind="AIConnector".
[AIConnector]
Enabled=1
ServerName=Esempio 1
Instructions=Funzioni di prova: demo_Ping, demo_Saluta, demo_Somma.
MaxCallsPerMinute=60
