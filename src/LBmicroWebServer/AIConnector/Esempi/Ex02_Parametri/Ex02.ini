; Esempio 2. Per vedere anche catalogo_NonDescritta metti ExposeUndescribed=1 e riavvia.

[LBmicroWebServer]
Port=8082

[OAuth]
Enabled=1
PublicBaseURL=http://127.0.0.1:8082
AllowInsecureHTTP=1
AllowLoopbackRedirects=1
ServerTitle=Esempio 2

[AIConnector]
Enabled=1
ServerName=Esempio 2
; 0 = solo le funzioni descritte sono strumenti (predefinito). 1 = ogni endpoint Standard autenticato lo e':
; quelli non descritti accettano un oggetto JSON libero e l'agente conosce solo la Description di Routes.xml.
ExposeUndescribed=0
