; Esempio 3. Tutte le opzioni del connettore sono qui, nel file INI.

[LBmicroWebServer]
Port=8083

[OAuth]
Enabled=1
PublicBaseURL=http://127.0.0.1:8083
AllowInsecureHTTP=1
AllowLoopbackRedirects=1
ServerTitle=Esempio 3

[AIConnector]
Enabled=1
ServerName=Esempio 3
; ogni endpoint Standard autenticato e' uno strumento anche se la sua classe non lo descrive
ExposeUndescribed=1
; ... ma uno strumento senza OpType (aperto a ogni utente autenticato) non viene esposto
RequireOpTypeForTools=1
; chiamate al minuto per utente
MaxCallsPerMinute=5
; Origin ammesse per richieste che arrivano da un browser (i client MCP server-to-server non la mandano)
AllowedOrigins=http://127.0.0.1:8083
