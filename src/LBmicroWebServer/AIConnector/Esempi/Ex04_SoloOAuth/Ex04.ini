; Esempio 4: solo OAuth. Nessuna sezione [AIConnector].

[LBmicroWebServer]
Port=8084

[OAuth]
Enabled=1
PublicBaseURL=http://127.0.0.1:8084
AllowInsecureHTTP=1
AllowLoopbackRedirects=1
; Diciture della pagina di accesso: chiave assente o vuota = dicitura predefinita (neutra).
ServerTitle=Portale Manutenzione
LoginHeading=Accesso al portale
LoginIntro=Per usare {app} da {host} inserisci le tue credenziali.
UsernameLabel=Utente
PasswordLabel=Parola d'ordine
SubmitLabel=Entra
BadCredentials=Credenziali errate.
TooManyAttempts=Troppi tentativi. Riprova tra dieci minuti.
