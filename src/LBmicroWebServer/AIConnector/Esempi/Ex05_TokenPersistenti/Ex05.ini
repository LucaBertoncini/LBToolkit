[TokenManager]
; File SQLite dei token (relativo alla cartella da cui parte il programma). Senza questa chiave i token
; restano in memoria e un riavvio li perde (gli agenti AI dovrebbero rifare il login).
DBFile=ex05_tokens.db
; Inattivita' massima delle sessioni WEB, in secondi. I token dell'AI hanno la scadenza assoluta decisa da chi li emette.
TokenExpirationTime=3600
